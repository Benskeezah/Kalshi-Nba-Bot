# Runs the daily NBA props analysis on GitHub's servers, for free, twice a day.
# It never places trades. Setup steps are in SETUP.md.
name: Daily NBA props

on:
  schedule:
    - cron: "0 17 * * *"    # 7:00 am Hawaii / 1 pm New York: early look
    - cron: "30 21 * * *"   # 11:30 am Hawaii / 5:30 pm New York: before most tip-offs
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write           # save the prediction log back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily-props
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The box-score database is rebuilt only once (~15 min), then cached.
      - name: Restore stats database
        uses: actions/cache/restore@v6
        with:
          path: nba_stats.sqlite
          key: nba-stats-${{ github.run_id }}
          restore-keys: nba-stats-

      - name: Run today's analysis
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KALSHI_EDGE_DB: data/predictions.sqlite
          KALSHI_EDGE_STATS_DB: nba_stats.sqlite
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -o pipefail
          mkdir -p data site
          python -u -m kalshi_edge daily --out site 2>&1 | tee data/last_run.txt

      - name: Save stats database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: nba_stats.sqlite
          key: nba-stats-${{ github.run_id }}

      # Saves the track record and this run's log back to the repo. A failure here
      # is reported but doesn't stop the web page from publishing.
      - name: Save prediction log (track record)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp site/picks.json data/picks.json 2>/dev/null || true
          for f in data/predictions.sqlite data/last_run.txt data/picks.json data/odds_usage.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" main || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:main

      - uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: site

  publish:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
